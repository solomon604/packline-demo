<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packline — Miva Admission Pack Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Afacad:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    /* Miva Brand Guide */
    --ink:#09314F;        /* Deep Heritage Blue */
    --ink-dark:#02223A;
    --ink-light:#0B416A;
    --rust:#E43B31;       /* Empower Red */
    --rust-dark:#960C05;
    --rust-tint:#FBE4E1;
    --gold:#B79A7F;       /* Wisdom Gold */
    --gold-dark:#85705A;
    --gold-tint:#EAE1D7;
    --mint:#5CDAAA;       /* Thrive Mint (extended) */
    --mint-dark:#166F53;
    --mint-tint:#DFF5EC;
    --paper:#F8F5F2;
    --surface:#FFFFFF;
    --steel:#63696E;
    --steel-light:#DAD5CC;
    --line:#DFDAD0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:'Manrope',Arial,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Afacad',Arial,sans-serif;font-weight:700;}
  .num{font-variant-numeric:tabular-nums;}
  #app{max-width:1260px;margin:0 auto;padding:0 28px 64px;}

  header.top{display:flex;align-items:flex-end;justify-content:space-between;padding:26px 0 16px;border-bottom:2px solid var(--ink);flex-wrap:wrap;gap:14px;}
  .brand-row{display:flex;align-items:center;gap:10px;}
  .brand-row .divider-mark{width:1.5px;height:26px;background:var(--line);margin:0 4px;}
  .wordmark{font-family:'Afacad',Arial,sans-serif;font-size:23px;font-weight:700;letter-spacing:.01em;color:var(--ink);}
  .product-name{font-family:'Afacad',Arial,sans-serif;font-size:19px;font-weight:600;color:var(--steel);}
  .product-name b{color:var(--gold-dark);}
  .stamp{border:1.5px solid var(--rust);color:var(--rust);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;padding:3px 8px;border-radius:2px;transform:rotate(-2deg);letter-spacing:.06em;white-space:nowrap;}
  .tagline{color:var(--steel);font-size:12.5px;margin-top:5px;max-width:560px;line-height:1.4;}
  .today-box{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--steel);text-align:right;line-height:1.6;}
  .today-box b{color:var(--ink);}

  .view-switch{display:flex;gap:0;margin:20px 0 24px;border:1.5px solid var(--ink);width:fit-content;}
  .view-switch button{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;background:var(--paper);color:var(--ink);border:none;padding:9px 20px;cursor:pointer;}
  .view-switch button.active{background:var(--ink);color:#fff;}
  .view-switch button:not(:last-child){border-right:1.5px solid var(--ink);}
  .view-hint{font-size:12px;color:var(--steel);margin:-16px 0 24px;}

  nav.tabs{display:flex;gap:2px;margin:0 0 28px;flex-wrap:wrap;}
  nav.tabs button{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;background:var(--steel-light);color:var(--steel);border:none;padding:11px 18px 9px;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% 100%,0 100%,0 10px);transition:background .15s,color .15s;}
  nav.tabs button:first-child{clip-path:polygon(0 0,100% 0,100% 100%,0 100%);}
  nav.tabs button.active{background:var(--ink);color:#fff;}
  nav.tabs button:not(.active):hover{background:#c9c4b6;}

  .section-title{font-size:19px;font-weight:700;margin:0 0 4px;}
  .section-sub{color:var(--steel);font-size:13px;margin:0 0 18px;max-width:680px;line-height:1.5;}
  .stat-strip{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);background:var(--surface);}
  .stat{padding:15px 17px;border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat.clickable{cursor:pointer;transition:background .12s;}
  .stat.clickable:hover{background:#FBF9F5;}
  .stat .label{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--steel);font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .stat .chev{font-size:10px;color:var(--steel);}
  .stat .value{font-size:27px;font-weight:700;margin-top:6px;font-family:'Afacad',sans-serif;}
  .stat .sub{font-size:11px;color:var(--steel);margin-top:3px;}
  .flag-rust{color:var(--rust-dark);} .flag-mint{color:var(--mint-dark);} .flag-gold{color:var(--gold-dark);}
  .detail-panel{border:1px solid var(--line);border-top:none;background:#FBF9F5;padding:18px 20px;margin-bottom:30px;}
  .detail-panel h4{margin:0 0 12px;font-size:13px;font-weight:700;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--surface);}
  thead th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--steel);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--ink);white-space:nowrap;}
  tbody td{padding:7px 10px;border-bottom:1px solid var(--line);}
  tbody tr:hover{background:#FBF9F5;}
  .table-wrap{border:1px solid var(--line);overflow-x:auto;margin-bottom:26px;max-height:420px;overflow-y:auto;}
  .table-wrap.short{max-height:280px;}

  .badge{display:inline-block;font-size:10px;font-weight:700;padding:3px 8px;border-radius:2px;letter-spacing:.02em;white-space:nowrap;}
  .badge-awaiting{background:var(--gold-tint);color:var(--gold-dark);}
  .badge-pending{background:#FDEFD4;color:#8A5A20;}
  .badge-packed{background:#E4ECF3;color:var(--ink);}
  .badge-delivered{background:var(--mint-tint);color:var(--mint-dark);}
  .badge-short{background:var(--rust-tint);color:var(--rust-dark);}
  .badge-type{background:#EDEAE0;color:var(--steel);font-size:9.5px;}

  .grid-2{display:grid;grid-template-columns:1.15fr 1fr;gap:24px;}
  .card{border:1px solid var(--line);background:var(--surface);padding:19px 21px;}
  .card h3{font-size:14px;margin:0 0 14px;font-weight:700;}

  label{display:block;font-size:11px;font-weight:700;color:var(--steel);margin-bottom:5px;margin-top:13px;}
  label:first-of-type{margin-top:0;}
  select,input[type=text],input[type=number],input[type=date]{width:100%;padding:8px 10px;border:1px solid var(--line);background:var(--paper);font-family:'Manrope',sans-serif;font-size:13px;color:var(--ink);}
  select:focus,input:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .radio-row{display:flex;gap:0;margin-top:6px;border:1.5px solid var(--ink);width:fit-content;flex-wrap:wrap;}
  .radio-row button{font-family:'Manrope';font-weight:700;font-size:12px;padding:7px 13px;border:none;background:var(--paper);color:var(--ink);cursor:pointer;}
  .radio-row button.active{background:var(--ink);color:#fff;}
  .radio-row button:not(:last-child){border-right:1.5px solid var(--ink);}

  button.btn{font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;background:var(--ink);color:#fff;border:none;padding:10px 17px;cursor:pointer;margin-top:17px;transition:background .15s;}
  button.btn:hover{background:var(--ink-light);}
  button.btn.secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}
  button.btn.secondary:hover{background:var(--ink);color:#fff;}
  button.btn.small{padding:5px 10px;font-size:10.5px;margin-top:0;}
  button.btn:disabled{background:var(--steel-light);color:var(--steel);cursor:not-allowed;}
  button.btn.mint{background:var(--mint-dark);} button.btn.mint:hover{background:#0f5b43;}
  button.btn.gold{background:var(--gold-dark);} button.btn.gold:hover{background:#6c5946;}

  .filter-row{display:flex;gap:13px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;padding:13px 15px;background:var(--surface);border:1px solid var(--line);}
  .filter-row .f{min-width:145px;}
  .filter-row label{margin:0 0 5px;}

  .confirm-box{border:1.5px dashed var(--gold-dark);background:var(--gold-tint);padding:20px 22px;margin-top:20px;display:flex;gap:22px;align-items:center;}
  .order-id{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:13.5px;letter-spacing:.02em;}

  .bar-chart{display:flex;align-items:flex-end;gap:9px;height:135px;border-bottom:1.5px solid var(--ink);padding-top:10px;}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;}
  .bar-pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center;}
  .bar{width:12px;border-radius:1.5px 1.5px 0 0;}
  .bar.placed{background:var(--gold);} .bar.delivered{background:var(--mint-dark);}
  .bar-label{font-size:9px;color:var(--steel);margin-top:6px;font-family:'JetBrains Mono',monospace;}
  .legend{display:flex;gap:16px;font-size:11.5px;color:var(--steel);margin-top:11px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:10px;height:10px;display:inline-block;border-radius:2px;}

  .hbar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .hbar-label{width:100px;font-size:12px;font-weight:700;flex-shrink:0;}
  .hbar-track{flex:1;background:var(--steel-light);height:14px;position:relative;}
  .hbar-fill{background:var(--rust);height:100%;}
  .hbar-fill.mint{background:var(--mint-dark);}
  .hbar-val{width:34px;text-align:right;font-size:11.5px;font-family:'JetBrains Mono',monospace;flex-shrink:0;}

  .note{font-size:11px;color:var(--steel);line-height:1.5;margin-top:6px;}
  .divider{border:none;border-top:1px solid var(--line);margin:24px 0;}
  .empty{padding:24px;text-align:center;color:var(--steel);font-size:12.5px;}
  .alert-row{background:var(--rust-tint);}
  .reorder-select{font-size:11.5px;padding:5px 6px;}

  .student-shell{max-width:520px;margin:0 auto;}
  .track-result{border:1px solid var(--line);background:var(--surface);padding:19px 21px;margin-top:16px;}
  .timeline{display:flex;margin-top:16px;}
  .tl-step{flex:1;text-align:center;position:relative;}
  .tl-dot{width:22px;height:22px;border-radius:50%;background:var(--steel-light);color:var(--steel);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:11.5px;font-weight:700;border:2px solid var(--steel-light);}
  .tl-step.done .tl-dot{background:var(--mint-dark);color:#fff;border-color:var(--mint-dark);}
  .tl-step.current .tl-dot{background:var(--gold-dark);color:#fff;border-color:var(--gold-dark);}
  .tl-line{position:absolute;top:11px;left:-50%;width:100%;height:2px;background:var(--steel-light);z-index:-1;}
  .tl-step.done .tl-line{background:var(--mint-dark);}
  .tl-step:first-child .tl-line{display:none;}
  .tl-label{font-size:10.5px;font-weight:700;}
  .tl-date{font-size:9.5px;color:var(--steel);margin-top:2px;}

  @media (max-width:760px){
    .stat-strip{grid-template-columns:repeat(2,1fr);}
    .stat:nth-child(2n){border-right:none;}
    .grid-2{grid-template-columns:1fr;}
    nav.tabs{flex-wrap:wrap;}
    header.top{flex-direction:column;align-items:flex-start;}
    .today-box{text-align:left;}
  }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="brand-row">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><path d="M2 4 L13 9 L13 22 L2 17 Z" fill="#09314F"/><path d="M24 4 L13 9 L13 22 L24 17 Z" fill="#09314F" opacity="0.55"/><rect x="12.3" y="8" width="1.4" height="14" fill="#B79A7F"/></svg>
        <div class="wordmark">MIVA</div>
        <div class="divider-mark"></div>
        <div class="product-name">Pack<b>line</b></div>
        <div class="stamp">PROTOTYPE — CONCEPT DEMO</div>
      </div>
      <div class="tagline">One system for admission-pack inventory, orders and delivery — replacing the Excel trackers with a single live record, from the port in Lagos to the student's door.</div>
    </div>
    <div class="today-box">Demo clock: <b id="today-label"></b><br>Data below is illustrative seed data</div>
  </header>

  <div class="view-switch" id="view-switch"></div>
  <div class="view-hint" id="view-hint"></div>

  <nav class="tabs" id="tabs"></nav>
  <div id="view-root"></div>
</div>

<script>
/* ============================== REFERENCE DATA ============================== */
const PROGRAMMES = ['UG','MBA','MPA','MIT','MPH','MCSM','MISD','MSCM','MAI','DBA'];
const PROGRAMME_LABEL = {UG:'Undergraduate',MBA:'MBA',MPA:'MPA',MIT:'MIT',MPH:'MPH',MCSM:'MCSM',MISD:'MISD',MSCM:'MSCM',MAI:'MAI',DBA:'DBA'};
const LOCATIONS = ['Lagos','Abuja','Jos','Port Harcourt','Ibadan','Abeokuta','Kaduna'];
const LOCATION_TYPE = {Lagos:'Warehouse', Abuja:'Warehouse', Jos:'Study Centre', 'Port Harcourt':'Study Centre', Ibadan:'Study Centre', Abeokuta:'Study Centre', Kaduna:'Study Centre'};
const LOCATION_ADDRESS = {
  Lagos:'Yaba, Lagos (address to be finalised)', Abuja:'Utako, Abuja',
  Jos:'Address to be confirmed', 'Port Harcourt':'Address to be confirmed',
  Ibadan:'Address to be confirmed', Abeokuta:'Address to be confirmed', Kaduna:'Address to be confirmed',
};
const HUB_LOCATIONS = ['Lagos','Abuja','Jos','Port Harcourt']; // doorstep orders route to one of these 4
const TODAY = new Date('2026-09-15');

const STATES = ['Abia','Adamawa','Akwa Ibom','Anambra','Bauchi','Bayelsa','Benue','Borno','Cross River','Delta',
  'Ebonyi','Edo','Ekiti','Enugu','FCT (Abuja)','Gombe','Imo','Jigawa','Kaduna','Kano','Katsina','Kebbi','Kogi',
  'Kwara','Lagos','Nasarawa','Niger','Ogun','Ondo','Osun','Oyo','Plateau','Rivers','Sokoto','Taraba','Yobe','Zamfara'];

// Which hub dispatches doorstep orders for each state — an illustrative simplification for the demo,
// to be confirmed against actual GIG Logistics routing before this goes live.
const STATE_HUB = {};
['Lagos','Ogun','Oyo','Osun','Ondo','Ekiti','Edo','Delta'].forEach(s=>STATE_HUB[s]='Lagos');
['FCT (Abuja)','Niger','Kaduna','Kano','Katsina','Kebbi','Sokoto','Zamfara','Jigawa','Bauchi','Gombe','Yobe','Borno','Adamawa','Taraba','Kwara','Kogi','Nasarawa','Benue'].forEach(s=>STATE_HUB[s]='Abuja');
STATE_HUB['Plateau']='Jos';
['Rivers','Bayelsa','Akwa Ibom','Cross River','Imo','Abia','Anambra','Ebonyi','Enugu'].forEach(s=>STATE_HUB[s]='Port Harcourt');

function mulberry32(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = mulberry32(20260915);
function pick(arr){return arr[Math.floor(rand()*arr.length)];}
function fmt(n){return Math.round(n).toLocaleString('en-US');}
function fmtDate(d){return d.toISOString().slice(0,10);}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}

/* ============================== STOCK: on-hand vs reserved ============================== */
let stock = {};
const SEED_ONHAND = {
  Lagos:          {UG:2631,MBA:912,MPA:382,MIT:0,  MPH:53,MCSM:23,MISD:2,MSCM:0,MAI:50,DBA:20},
  Abuja:          {UG:3450,MBA:1670,MPA:246,MIT:115,MPH:52,MCSM:23,MISD:0,MSCM:0,MAI:50,DBA:9},
  Jos:            {UG:50,  MBA:52, MPA:22, MIT:31, MPH:15,MCSM:0, MISD:0,MSCM:0,MAI:0, DBA:0},
  'Port Harcourt':{UG:475, MBA:122,MPA:49, MIT:78, MPH:50,MCSM:0, MISD:0,MSCM:0,MAI:0, DBA:0},
  Ibadan:         {UG:60,  MBA:18, MPA:8,  MIT:6,  MPH:5, MCSM:0, MISD:0,MSCM:0,MAI:0, DBA:0},
  Abeokuta:       {UG:35,  MBA:10, MPA:4,  MIT:3,  MPH:3, MCSM:0, MISD:0,MSCM:0,MAI:0, DBA:0},
  Kaduna:         {UG:40,  MBA:12, MPA:5,  MIT:4,  MPH:3, MCSM:0, MISD:0,MSCM:0,MAI:0, DBA:0},
};
LOCATIONS.forEach(l=>{ stock[l]={}; PROGRAMMES.forEach(p=>{ stock[l][p] = {onHand: SEED_ONHAND[l][p], reserved: 0}; }); });

let reorderPoint = {
  Lagos:          {UG:1000,MBA:400,MPA:150,MIT:150,MPH:120,MCSM:30,MISD:30,MSCM:30,MAI:30,DBA:15},
  Abuja:          {UG:1200,MBA:500,MPA:120,MIT:100,MPH:100,MCSM:30,MISD:30,MSCM:30,MAI:30,DBA:10},
  Jos:            {UG:40,  MBA:30, MPA:15, MIT:15, MPH:15, MCSM:10,MISD:10,MSCM:10,MAI:10,DBA:5},
  'Port Harcourt':{UG:150, MBA:60, MPA:25, MIT:30, MPH:25, MCSM:10,MISD:10,MSCM:10,MAI:10,DBA:5},
  Ibadan:         {UG:20,  MBA:8,  MPA:4,  MIT:4,  MPH:3,  MCSM:3, MISD:3, MSCM:3, MAI:3, DBA:2},
  Abeokuta:       {UG:15,  MBA:6,  MPA:3,  MIT:3,  MPH:2,  MCSM:2, MISD:2, MSCM:2, MAI:2, DBA:2},
  Kaduna:         {UG:15,  MBA:6,  MPA:3,  MIT:3,  MPH:2,  MCSM:2, MISD:2, MSCM:2, MAI:2, DBA:2},
};
// dropdown choice of reorder source per location+programme, defaults to a sensible action
let reorderAction = {};
LOCATIONS.forEach(l=>{ reorderAction[l]={}; PROGRAMMES.forEach(p=>{ reorderAction[l][p] = (l==='Lagos') ? 'China' : 'Lagos'; }); });

function available(loc,prog){return stock[loc][prog].onHand - stock[loc][prog].reserved;}

let shipments = [
  {id:'SH-0114', date:'2026-08-18', programme:'UG',  qty:2000, note:'China batch #114 — cleared, landed Lagos port'},
  {id:'SH-0114b',date:'2026-08-18', programme:'MBA', qty:500,  note:'China batch #114 — cleared, landed Lagos port'},
  {id:'SH-0115', date:'2026-09-01', programme:'DBA', qty:50,   note:'China batch #115 — cleared, landed Lagos port'},
];
let transfers = [
  {id:'TR-0091', date:'2026-08-22', from:'Lagos', to:'Abuja', programme:'UG',  qty:1200},
  {id:'TR-0092', date:'2026-08-23', from:'Lagos', to:'Jos',   programme:'MBA', qty:60},
];

/* ============================== ORDER / TRACKING NUMBERS ============================== */
// Each order gets its own unique tracking number, drawn from that programme's own numbering
// sequence — e.g. every MBA box in the system carries an "MBA-xxxxxx" number, generated the
// moment a unit is available to promise to a student. No two orders can ever share one.
let trackingSeq = {}; PROGRAMMES.forEach(p=>trackingSeq[p]=1);
function issueTrackingNo(prog){ const no = prog+'-'+String(trackingSeq[prog]).padStart(6,'0'); trackingSeq[prog]++; return no; }
function nextInternalId(d){return 'REF-'+d.toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.floor(rand()*9000+1000);}
function nextStudentId(){return 'STU-'+String(40000+Math.floor(rand()*9000));}

/* order stock effects: reserve at order time (issue tracking no. if a unit is free), release+decrement onHand at delivery */
function reserveForOrder(o){
  const wasFree = available(o.fulfillingLocation,o.programme) > 0;
  stock[o.fulfillingLocation][o.programme].reserved += 1;
  if(wasFree){ o.trackingNo = issueTrackingNo(o.programme); o.status='Pending'; }
  else { o.trackingNo = null; o.status='Awaiting Stock'; }
}
function issueNowIfPossible(o){
  if(o.trackingNo) return false;
  if(stock[o.fulfillingLocation][o.programme].onHand > 0){
    o.trackingNo = issueTrackingNo(o.programme); o.status='Pending'; return true;
  }
  return false;
}
function finalizeDelivery(o){
  stock[o.fulfillingLocation][o.programme].onHand -= 1;
  stock[o.fulfillingLocation][o.programme].reserved -= 1;
}

let orders = [];
(function seedOrders(){
  const names = ['Chidinma O.','Bashir A.','Temitope F.','Ngozi E.','Emeka U.','Halima S.','Damilola K.','Uche N.','Amara P.','Tunde B.','Fatima Y.','Ifeoma C.','Segun A.','Kelechi M.','Blessing I.'];
  for(let w=8; w>=0; w--){
    const weekStart = addDays(TODAY, -7*w);
    const nOrders = 3 + Math.floor(rand()*5);
    for(let i=0;i<nOrders;i++){
      const dOrdered = addDays(weekStart, Math.floor(rand()*7));
      if(dOrdered > TODAY) continue;
      const doorstep = rand() < 0.75;
      const state = pick(STATES);
      const pickupCentre = pick(LOCATIONS);
      const fulfillingLocation = doorstep ? STATE_HUB[state] : pickupCentre;
      const prog = pick(PROGRAMMES);
      const o = {
        id: nextInternalId(dOrdered), trackingNo:null, studentId: nextStudentId(), student: pick(names), programme: prog,
        deliveryMethod: doorstep?'doorstep':'pickup',
        state: doorstep?state:null, address: doorstep?(1+Math.floor(rand()*40))+' Sample Close':null,
        studyCentre: doorstep?null:pickupCentre,
        fulfillingLocation,
        dateOrdered: dOrdered, datePacked:null, dateDelivered:null, status:'Awaiting Stock'
      };
      reserveForOrder(o);
      const age = daysBetween(dOrdered, TODAY);
      if(o.trackingNo && age > 3 && rand() < 0.9){
        o.status='Packed';
        o.datePacked = addDays(dOrdered, 1+Math.floor(rand()*3));
        if(o.datePacked > TODAY) o.datePacked = TODAY;
        if(daysBetween(o.datePacked, TODAY) > 1 && rand() < 0.78){
          o.status='Delivered';
          o.dateDelivered = addDays(o.datePacked, 1+Math.floor(rand()*6));
          if(o.dateDelivered > TODAY) o.dateDelivered = TODAY;
          finalizeDelivery(o);
        }
      }
      orders.push(o);
    }
  }
  ['UG','MBA','MPH'].forEach(p=>{
    const state = pick(STATES);
    const o = {id: nextInternalId(TODAY), trackingNo:null, studentId: nextStudentId(), student: pick(names), programme:p,

      fulfillingLocation: STATE_HUB[state], dateOrdered: TODAY, datePacked:null, dateDelivered:null, status:'Awaiting Stock'};
    reserveForOrder(o);
    orders.push(o);
  });
})();

/* ============================== FAKE QR ============================== */
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function qrSVG(seed, size){
  size = size||88;
  const h = hashStr(seed);
  const n=7, cell=size/n;
  let bits=[]; let hh=h;
  for(let i=0;i<n*n;i++){ hh = (hh*1103515245+12345)>>>0; bits.push((hh>>>16)%2); }
  const isFinder=(r,c)=> (r<3&&c<3)||(r<3&&c>=n-3)||(r>=n-3&&c<3);
  let rects='';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    if(isFinder(r,c)) continue;
    if(bits[r*n+c]) rects += `<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="#09314F"/>`;
  }
  function finder(r,c){
    const x=c*cell,y=r*cell,s3=cell*3;
    return `<rect x="${x}" y="${y}" width="${s3}" height="${s3}" fill="none" stroke="#09314F" stroke-width="${cell*0.9}"/>
            <rect x="${x+cell}" y="${y+cell}" width="${cell}" height="${cell}" fill="#B79A7F"/>`;
  }
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;border:1px solid #DFDAD0;">
    ${finder(0,0)}${finder(0,n-3)}${finder(n-3,0)}${rects}
  </svg>`;
}

function setReorderPoint(loc,prog,val){reorderPoint[loc][prog] = parseInt(val)||0; render();}
function prefillFromAlert(loc,prog){
  const action = reorderAction[loc][prog];
  if(action==='China'){
    document.getElementById('ship-prog').value = prog;
    document.getElementById('ship-note').value = `Reorder trigger — ${loc} below threshold`;
  } else {
    document.getElementById('tr-prog').value = prog;
    document.getElementById('tr-from').value = action;
    document.getElementById('tr-to').value = loc;
  }
  document.getElementById(action==='China'?'ship-prog':'transfer-card').scrollIntoView({behavior:'smooth', block:'center'});
}
function doShipment(){
  const prog = document.getElementById('ship-prog').value;
  const qty = parseInt(document.getElementById('ship-qty').value)||0;
  const note = document.getElementById('ship-note').value || 'China shipment';
  if(qty<=0) return;
  stock.Lagos[prog].onHand += qty;
  shipments.push({id:'SH-'+String(1000+shipments.length), date: fmtDate(TODAY), programme:prog, qty, note});
  orders.filter(o=>o.status==='Awaiting Stock' && o.fulfillingLocation==='Lagos' && o.programme===prog).forEach(issueNowIfPossible);
  render();
}
function doTransfer(){
  const prog = document.getElementById('tr-prog').value;
  const from = document.getElementById('tr-from').value;
  const to = document.getElementById('tr-to').value;
  const qty = parseInt(document.getElementById('tr-qty').value)||0;
  const err = document.getElementById('tr-error');
  if(from===to){err.textContent='Pick two different locations.'; return;}
  if(qty>stock[from][prog].onHand){err.textContent=`${from} only has ${stock[from][prog].onHand} units of ${prog} on hand.`; return;}
  stock[from][prog].onHand-=qty; stock[to][prog].onHand+=qty;
  transfers.push({id:'TR-'+String(1000+transfers.length), date: fmtDate(TODAY), from, to, programme:prog, qty});
  orders.filter(o=>o.status==='Awaiting Stock' && o.fulfillingLocation===to && o.programme===prog).forEach(issueNowIfPossible);
  render();
}

      <label>Order number or Student ID</label>
      <input type="text" id="track-input" placeholder="e.g. MBA-000045 or STU-40213">
      <button class="btn" onclick="doTrack()">Track order</button>
    </div>
    <div id="track-result"></div>
    </div>
  `;
}
function doTrack(){
  const q = document.getElementById('track-input').value.trim().toUpperCase();
  const found = orders.filter(o=>(o.trackingNo && o.trackingNo.toUpperCase()===q) || o.studentId.toUpperCase()===q).sort((a,b)=>b.dateOrdered-a.dateOrdered);
  const box = document.getElementById('track-result');
  if(!found.length){ box.innerHTML = `<div class="track-result empty">No order found for "${q}". Check the number and try again.</div>`; return; }
  box.innerHTML = found.map(o=>{
    const steps = [
      {label:'Ordered', date:o.dateOrdered, done:true},
      {label:'Number issued', date: o.trackingNo?o.dateOrdered:null, done:!!o.trackingNo},
      {label:'Packed', date:o.datePacked, done:!!o.datePacked},
      {label:'Delivered', date:o.dateDelivered, done:!!o.dateDelivered},
    ];
    let currentSet=false;
    const stepsHtml = steps.map((s,i)=>{
      let cls = s.done ? 'done' : '';
      if(!s.done && !currentSet){ cls='current'; currentSet=true; }
      return `<div class="tl-step ${cls}"><div class="tl-line"></div><div class="tl-dot">${s.done?'✓':i+1}</div><div class="tl-label">${s.label}</div><div class="tl-date">${s.date?fmtDate(s.date):'—'}</div></div>`;
    }).join('');
    return `<div class="track-result">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div><b class="order-id">${o.trackingNo || '(awaiting stock)'}</b> — ${PROGRAMME_LABEL[o.programme]}</div>${badgeFor(o.status)}
      </div>
      <div class="note" style="margin-top:6px;">${deliveryDesc(o)}</div>
      <div class="timeline">${stepsHtml}</div>
    </div>`;
  }).join('');
}

/* ============================== ADMIN: FULFILMENT ============================== */
function viewFulfil(){
  const filtered = orders.filter(o=>
    (fFilters.location==='All'||o.fulfillingLocation===fFilters.location) &&
    (fFilters.programme==='All'||o.programme===fFilters.programme) &&
    (fFilters.status==='All'||o.status===fFilters.status)
  ).sort((a,b)=>b.dateOrdered-a.dateOrdered);

  const rows = filtered.slice(0,80).map(o=>{
    let action='';
    if(o.status==='Awaiting Stock'){
      const canIssue = stock[o.fulfillingLocation][o.programme].onHand > 0;
      action = `<button class="btn small gold" ${canIssue?'':'disabled'} onclick="doIssueNow('${o.id}')">${canIssue?'Issue number now':'Still no stock'}</button>`;
    } else if(o.status==='Pending'){
      const canPack = stock[o.fulfillingLocation][o.programme].onHand > 0;
      action = `<button class="btn small" ${canPack?'':'disabled'} onclick="markPacked('${o.id}')">${canPack?'Mark packed':'No physical stock'}</button>`;
    } else if(o.status==='Packed'){
      action = `<button class="btn small mint" onclick="markDelivered('${o.id}')">Simulate QR scan → Delivered</button>`;
    } else {
      action = `<span class="note">✓ ${daysBetween(o.dateOrdered,o.dateDelivered)}d order→delivery</span>`;
    }
    return `<tr>
      <td class="order-id">${displayNo(o)}</td>
      <td>${o.student}<br><span class="note">${o.studentId}</span></td>
      <td>${PROGRAMME_LABEL[o.programme]}</td>
      <td>${o.fulfillingLocation}</td>
      <td>${deliveryDesc(o)}</td>
      <td>${fmtDate(o.dateOrdered)}</td>
      <td>${badgeFor(o.status)}</td>
      <td>${action}</td>
    </tr>`;
  }).join('');

  return `
    <div class="section-title">Fulfilment queue &amp; QR delivery confirmation</div>
    <div class="section-sub">Every box carries its own unique order number and QR, generated the moment a free unit exists to promise. No two students are ever handed the same number. Scanning the QR on handover is the only thing that reduces on-hand stock and clears the backlog.</div>

    <div class="filter-row">
      <div class="f"><label>Fulfilling location</label><select onchange="fFilters.location=this.value; render();">${['All',...LOCATIONS].map(v=>`<option ${v===fFilters.location?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="f"><label>Programme</label><select onchange="fFilters.programme=this.value; render();">${['All',...PROGRAMMES].map(v=>`<option ${v===fFilters.programme?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="f"><label>Status</label><select onchange="fFilters.status=this.value; render();">${['All','Awaiting Stock','Pending','Packed','Delivered'].map(v=>`<option ${v===fFilters.status?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="note" style="margin-bottom:9px;">${filtered.length} order${filtered.length===1?'':'s'} matched ${filtered.length>80?'(showing 80 most recent)':''}</div>
    </div>

    <div class="table-wrap">
      <table><thead><tr><th>Order No.</th><th>Student</th><th>Programme</th><th>Location</th><th>Delivery</th><th>Ordered</th><th>Status</th><th>Action</th></tr></thead>
      <tbody>${rows || '<tr><td colspan=8 class="empty">No orders match these filters</td></tr>'}</tbody></table>
    </div>
  `;
}
function doIssueNow(id){ const o=orders.find(x=>x.id===id); if(o) issueNowIfPossible(o); render(); }
function markPacked(id){
  const o = orders.find(x=>x.id===id);
  if(!o || stock[o.fulfillingLocation][o.programme].onHand<=0) return;
  o.status='Packed'; o.datePacked=TODAY;
  render();
}
function markDelivered(id){
  const o = orders.find(x=>x.id===id);
  if(!o) return;
  o.status='Delivered'; o.dateDelivered=TODAY;
  finalizeDelivery(o);
  render();
}

/* ============================== ADMIN: REPORTS ============================== */
function monthOptions(){
  const set = new Set(orders.map(o=>o.dateOrdered.toISOString().slice(0,7)));
  return [...set].sort();
}
function viewReports(){
  let from, to=TODAY, label;
  if(rPeriod==='week'){ from=addDays(TODAY,-7); label='This week'; }
  else if(rPeriod==='month'){ from=addDays(TODAY,-30); label='This month (rolling 30d)'; }
  else if(rPeriod==='pick' && rMonth){ from=new Date(rMonth+'-01'); to=new Date(from.getFullYear(),from.getMonth()+1,0); label=rMonth; }
  else { from=new Date('2000-01-01'); label='All time'; }

  const ordered = orderedInRange(from,to);
  const delivered = deliveredInRange(from,to);
  const withBoth = delivered.filter(o=>o.dateOrdered && o.dateDelivered);
  const avgDays = withBoth.length ? (withBoth.reduce((s,o)=>s+daysBetween(o.dateOrdered,o.dateDelivered),0)/withBoth.length) : 0;

  const weeks=[];
  for(let w=7; w>=0; w--){
    const ws=addDays(TODAY,-7*(w+1)+1), we=addDays(TODAY,-7*w);
    weeks.push({label:fmtDate(ws).slice(5), placed:orderedInRange(ws,we).length, delivered:deliveredInRange(ws,we).length});
  }
  const maxV = Math.max(...weeks.map(w=>Math.max(w.placed,w.delivered)),1);
  const bars = weeks.map(w=>`<div class="bar-col"><div class="bar-pair">
      <div class="bar placed" style="height:${w.placed/maxV*100}%" title="${w.placed} placed"></div>
      <div class="bar delivered" style="height:${w.delivered/maxV*100}%" title="${w.delivered} delivered"></div>
    </div><div class="bar-label">${w.label}</div></div>`).join('');

  const byLoc = LOCATIONS.map(l=>({l,n:backlogOrders().filter(o=>o.fulfillingLocation===l).length}));
  const maxLoc = Math.max(...byLoc.map(x=>x.n),1);
  const locRows = byLoc.map(x=>x.n?`<div class="hbar-row"><div class="hbar-label">${x.l}</div><div class="hbar-track"><div class="hbar-fill" style="width:${x.n/maxLoc*100}%"></div></div><div class="hbar-val">${x.n}</div></div>`:'').join('');

  const months = monthOptions();

  return `
    <div class="section-title">Reports</div>
    <div class="section-sub">The same metrics Finance rebuilds by hand each week (backlog trend, processing time) — here they're a live filter, not a fresh pivot table.</div>

    <div class="filter-row">
      <div class="f"><label>Period</label><select onchange="rPeriod=this.value; render();">
        <option value="week" ${rPeriod==='week'?'selected':''}>This week</option>
        <option value="month" ${rPeriod==='month'?'selected':''}>This month (rolling 30d)</option>
        <option value="pick" ${rPeriod==='pick'?'selected':''}>Pick a specific month</option>
        <option value="all" ${rPeriod==='all'?'selected':''}>All time (since demo data began)</option>
      </select></div>
      ${rPeriod==='pick' ? `<div class="f"><label>Month</label><select onchange="rMonth=this.value; render();">${months.map(m=>`<option value="${m}" ${m===rMonth?'selected':''}>${m}</option>`).join('')}</select></div>` : ''}
    </div>

    <div class="stat-strip">
      <div class="stat"><div class="label">Orders placed</div><div class="value">${ordered.length}</div><div class="sub">${label}</div></div>
      <div class="stat"><div class="label">Delivered</div><div class="value flag-mint">${delivered.length}</div><div class="sub">${label}</div></div>
      <div class="stat"><div class="label">Avg. order → delivery</div><div class="value">${avgDays.toFixed(1)}<span style="font-size:15px;">d</span></div><div class="sub">mirrors "Processing Time by Office"</div></div>
      <div class="stat"><div class="label">Current backlog</div><div class="value flag-rust">${backlogOrders().length}</div><div class="sub">as of today, not period-limited</div></div>
    </div>
    <div style="height:24px;"></div>
    <div class="grid-2">
      <div>
        <h3 style="font-size:14px;margin:0 0 12px;">Orders placed vs. delivered, last 8 weeks</h3>
        <div class="bar-chart">${bars}</div>
        <div class="legend"><span><i style="background:var(--gold)"></i>Placed</span><span><i style="background:var(--mint-dark)"></i>Delivered</span></div>
      </div>
      <div class="card">
        <h3>Backlog by fulfilling location, right now</h3>
        ${locRows || '<p class="note">No backlog right now.</p>'}
      </div>
    </div>
  `;
}

/* ============================== RENDER ROOT ============================== */
function render(){
  renderChrome();
  document.getElementById('today-label').textContent = fmtDate(TODAY);
  const root = document.getElementById('view-root');
  if(currentView==='student'){
    if(activeTab==='order') root.innerHTML = viewOrderStudent();
    else root.innerHTML = viewTrackStudent();
  } else {
    if(activeTab==='dashboard') root.innerHTML = viewDashboard();
    else if(activeTab==='incoming') root.innerHTML = viewIncoming();
    else if(activeTab==='fulfil') root.innerHTML = viewFulfil();
    else if(activeTab==='reports') root.innerHTML = viewReports();
  }
}
render();
</script>
</body>
</html>
